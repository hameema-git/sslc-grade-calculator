<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        SSLC Grade Calculator 2026
    </title>

    <!-- GOOGLE ANALYTICS -->

    <script async
            src="https://www.googletagmanager.com/gtag/js?id=G-WN8909VMVG">
    </script>

    <script>

        window.dataLayer = window.dataLayer || [];

        function gtag(){

            dataLayer.push(arguments);

        }

        gtag('js', new Date());

        gtag('config', 'G-WN8909VMVG');

    </script>

    <!-- GOOGLE FONTS -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="container">

    <!-- LOGO -->

    <div class="logo-section">

        <img src="WIS-LOGO.png"
             class="wisdom-logo">

    </div>

    <!-- TITLE -->

    <h1>
        SSLC Grade Calculator 2026
    </h1>

    <!-- RESULT LINKS -->

    <div class="result-links">

        <h3>
            Check SSLC Result First
        </h3>

        <a href="https://results.kite.kerala.gov.in"
           target="_blank">

           results.kite.kerala.gov.in

        </a>

        <a href="https://results.kerala.gov.in"
           target="_blank">

           results.kerala.gov.in

        </a>

        <a href="https://prd.kerala.gov.in"
           target="_blank">

           prd.kerala.gov.in

        </a>

    </div>

    <!-- FORM -->
  

    <div class="form-box">

        <!-- OPTIONAL NAME -->

        <div class="input-box">

            <label>
                Student Name (Optional)
            </label>

            <input type="text"
                   id="studentName"
                   placeholder="Enter Student Name">

        </div>

        <!-- NOTE -->

        <!-- <div class="note-box">

            Maximum subjects allowed:
            <strong>10</strong>

        </div> -->

        <!-- GRADE GRID -->

        <div class="grade-grid">

            <div class="grade-item">
                <label>A+</label>
                <input type="number" id="aplus" value="0">
            </div>

            <div class="grade-item">
                <label>A</label>
                <input type="number" id="a" value="0">
            </div>

            <div class="grade-item">
                <label>B+</label>
                <input type="number" id="bplus" value="0">
            </div>

            <div class="grade-item">
                <label>B</label>
                <input type="number" id="b" value="0">
            </div>

            <div class="grade-item">
                <label>C+</label>
                <input type="number" id="cplus" value="0">
            </div>

            <div class="grade-item">
                <label>C</label>
                <input type="number" id="c" value="0">
            </div>

            <div class="grade-item">
                <label>D+</label>
                <input type="number" id="dplus" value="0">
            </div>

            <div class="grade-item">
                <label>D</label>
                <input type="number" id="d" value="0">
            </div>

        </div>

        <!-- BUTTON -->

        <button class="calculate-btn"
                onclick="calculateResult()">

            Calculate Percentage

        </button>

    </div>

</div>

<!-- POPUP -->

<div class="popup-overlay"
     id="popupOverlay">

</div>

<div class="popup-card"
     id="popupCard">

    <button class="close-btn"
            onclick="closePopup()">

        ×

    </button>

    <h2>
        Result
    </h2>

    <div class="popup-result">

        <p id="popupName"></p>

        <p id="percentage"></p>

        <p id="grade"></p>

        <p id="classification"></p>

        <p id="tgp"></p>

    </div>

    <button class="copy-btn"
            onclick="copyResult()">

        Copy Result

    </button>

</div>

<!-- FOOTER -->

<footer class="footer">

    <a href="https://codeleaf.co.in"
       target="_blank"
       class="footer-brand">

        <img src="logo.png"
             class="footer-logo">

        <span>
            Crafted by Code Leaf
        </span>

    </a>

</footer>

<script src="script.js"></script>

</body>

</html>
